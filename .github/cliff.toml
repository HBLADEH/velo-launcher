[changelog]
body = """
{% if version %}## {{ version }}{% else %}## 未发布{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/HBLADEH/velo-launcher/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->新功能" },
    { message = "^fix", group = "<!-- 1 -->问题修复" },
    { message = "^perf", group = "<!-- 2 -->性能优化" },
    { message = "^refactor", group = "<!-- 3 -->代码重构" },
    { message = "^docs", group = "<!-- 4 -->文档" },
    { message = ".*", group = "<!-- 5 -->其他变更" },
]
sort_commits = "oldest"
