name: Publish Velo release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'velo-public-release' || format('velo-release-preview-{0}', github.ref) }}
  queue: max
jobs:
  validate-tag:
    if: github.repository == 'HBLADEH/velo-launcher' && !github.event.deleted
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      draft_checksums: ${{ steps.tag.outputs.draft_checksums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release source
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            "commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
            return
          }
          $commit = ./scripts/check-rust-release-tag.ps1 -Tag $env:GITHUB_REF_NAME -EventSha $env:GITHUB_SHA
          "commit=$commit" >> $env:GITHUB_OUTPUT
          $trailers = @(git for-each-ref '--format=%(trailers:key=Velo-Release-Draft,valueonly)' "refs/tags/$env:GITHUB_REF_NAME" | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release tag annotation.' }
          if ($trailers.Count) {
            if ($trailers.Count -ne 1 -or $trailers[0] -cnotmatch '\A[0-9a-f]{64}\z') {
              throw 'Velo-Release-Draft must contain the SHA-256 of the staged SHA256SUMS.txt.'
            }
            "draft_checksums=$($trailers[0])" >> $env:GITHUB_OUTPUT
          }

  package:
    needs: validate-tag
    if: needs.validate-tag.outputs.draft_checksums == ''
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      VELO_PACKAGE_DIRECTORY: target/ci-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = Get-Content -Raw -LiteralPath rust-toolchain.toml
          if ($toolchain -notmatch '(?m)^channel\s*=\s*"(?<channel>[0-9]+\.[0-9]+\.[0-9]+-x86_64-pc-windows-msvc)"\s*$') {
            throw 'Expected a pinned Windows x64 MSVC channel in rust-toolchain.toml.'
          }
          rustup toolchain install $Matches.channel --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Prepare the pinned NSIS toolchain
        id: nsis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target -Force | Out-Null
          $compiler = ./scripts/prepare-rust-packaging-tools.ps1 -OutputDirectory "target/ci-nsis-${{ github.run_id }}-${{ github.run_attempt }}"
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Test and build both product renderers
        shell: pwsh
        run: ./scripts/verify-rust.ps1 -Product -HostedCI
      - name: Stage verified installers and notices
        id: package
        shell: pwsh
        env:
          VELO_MAKENSIS: ${{ steps.nsis.outputs.compiler }}
        run: |
          ./scripts/package-rust-release.ps1 -OutputDirectory $env:VELO_PACKAGE_DIRECTORY -Makensis $env:VELO_MAKENSIS
          "artifact=velo-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Select release notes
        id: notes
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $notes = "docs/releases/$version.md"
            if (Test-Path -LiteralPath $notes -PathType Leaf) {
              Copy-Item -LiteralPath $notes -Destination "$env:VELO_PACKAGE_DIRECTORY/release-notes.md"
              return
            }
          }
          'generate=true' >> $env:GITHUB_OUTPUT
      - name: Generate release notes from commit history
        if: steps.notes.outputs.generate == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: .github/cliff.toml
          args: ${{ github.event_name == 'push' && '--current --use-branch-tags' || '--unreleased --use-branch-tags' }}
        env:
          OUTPUT: ${{ env.VELO_PACKAGE_DIRECTORY }}/release-notes.md
      - name: Verify the staged assets and notes
        shell: pwsh
        env:
          VELO_RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          $policy = Get-Content -Raw -LiteralPath windows/release-policy.json | ConvertFrom-Json
          $options = @{
            Tag = $policy.ReleaseTag
            Commit = $env:VELO_RELEASE_COMMIT
            Directory = "$env:VELO_PACKAGE_DIRECTORY/assets"
            NotesFile = "$env:VELO_PACKAGE_DIRECTORY/release-notes.md"
          }
          ./scripts/publish-rust-release.ps1 @options -ValidateOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ env.VELO_PACKAGE_DIRECTORY }}/assets/
            ${{ env.VELO_PACKAGE_DIRECTORY }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate-tag, package]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      !cancelled() && needs.validate-tag.result == 'success' &&
      (needs.package.result == 'success' ||
      (needs.package.result == 'skipped' && needs.validate-tag.outputs.draft_checksums != ''))
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    environment: public-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.validate-tag.outputs.draft_checksums == ''
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: target/release-package
      - name: Verify uploaded digests before making the release public
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VELO_RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
          VELO_DRAFT_CHECKSUMS: ${{ needs.validate-tag.outputs.draft_checksums }}
        run: |
          $options = @{
            Tag = $env:GITHUB_REF_NAME
            Commit = $env:VELO_RELEASE_COMMIT
          }
          if ($env:VELO_DRAFT_CHECKSUMS) {
            $options.Directory = 'target/release-assets'
            $options.DraftChecksumsSHA256 = $env:VELO_DRAFT_CHECKSUMS
          } else {
            $options.Directory = 'target/release-package/assets'
            $options.NotesFile = 'target/release-package/release-notes.md'
          }
          ./scripts/publish-rust-release.ps1 @options
