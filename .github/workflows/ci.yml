name: Rust Windows validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Requires the exact Rust/MSVC/SDK versions from the repository, plus an
    # interactive Windows desktop for native component smoke tests.
    runs-on: [self-hosted, Windows, X64, velo-locked-toolchain]
    timeout-minutes: 180
    concurrency:
      group: velo-rust-desktop-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Verify both product renderers
        shell: pwsh
        run: ./scripts/verify-rust.ps1 -Product -SmokeTest
      - name: Prepare pinned NSIS
        shell: pwsh
        run: ./scripts/prepare-rust-packaging-tools.ps1 -OutputDirectory rust/target/ci-packaging-tools
      - name: Package approved Rust release
        shell: pwsh
        run: |
          $tools = Get-Content -Raw rust/target/ci-packaging-tools/tools.json | ConvertFrom-Json
          ./scripts/package-rust-release.ps1 -OutputDirectory rust/target/ci-release -Makensis $tools.Compiler
      - uses: actions/upload-artifact@v4
        with:
          name: velo-rust-windows-x64
          path: rust/target/ci-release/assets/*
          if-no-files-found: error
