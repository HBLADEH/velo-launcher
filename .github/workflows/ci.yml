name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm ci
        working-directory: frontend
      - name: Ensure NSIS (makensis)
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --no-progress -y
          }
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsis\makensis.exe")) { throw "makensis not found in $nsis" }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$nsis\makensis.exe" -VERSION
      - run: ./scripts/verify.ps1 -Installer
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: velo-launcher-windows-amd64
          path: |
            build/bin/velo-launcher.exe
            build/bin/*-installer.exe
          if-no-files-found: error
