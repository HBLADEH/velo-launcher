name: 功能建议 / Feature request
description: 描述使用场景，以及希望 Velo 改善的体验。也可使用英文填写。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享你的使用需求，请先搜索已有建议。
        中文、英文均可填写。Chinese and English suggestions are welcome.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 你在做什么，当前有哪些不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的体验 / Proposed behavior
      description: 说明希望如何操作，以及操作后的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考 / Alternatives or examples
      description: 可选，附上当前做法、类似工具或示意图。
